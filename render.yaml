services:
  - type: web
    name: dankook-graduate
    runtime: node
    branch: main
    autoDeployTrigger: checksPass
    region: singapore
    plan: free
    buildCommand: npm ci --legacy-peer-deps && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: NEON_DATABASE_URL
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_ORIGIN
        value: https://dankook-graduate.onrender.com
